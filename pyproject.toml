[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genova-operator"
version = "0.1.0.dev1"
description = "Operational and automation layer for the Genova Nexus ecosystem"
readme = "README.md"
authors = [
    { name = "Genova Nexus Team" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Genova-Nexus/Genova-Operator"
Documentation = "https://github.com/Genova-Nexus/Genova-Operator#readme"
Repository = "https://github.com/Genova-Nexus/Genova-Operator"
Issues = "https://github.com/Genova-Nexus/Genova-Operator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genova_operator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
